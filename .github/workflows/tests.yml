name: tests
on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{matrix.os}}
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                go-version-file: go.mod
                cache: true
            - run: make vet
            - run: make test
            - run: make cross
            - run: GOOS=windows go build ./...
